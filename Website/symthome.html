      <main class="main">

        <form>
          <fieldset>
            <legend>How are you feeling?</legend>
            <label>
              <input type="checkbox" name="anxiety">
              Do you feel anxiety?
            </label>

            <label>
              <input type="checkbox" name="sadness">
              Do you regularly feel sadness?

            <label>
              <input type="checkbox" name="lonely">
              Do you miss your friends heavily?
            </label>
          </fieldset>

          <button type="submit">Submit responses</button>
        </form>
      </main>
