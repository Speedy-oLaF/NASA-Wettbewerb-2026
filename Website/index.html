<script>

// Einstellungen
const TIMER_DURATION = 23 * 60 * 60 * 1000;

// Gespeicherten Startzeitpunkt laden
let startTime = localStorage.getItem("healthTimerStart");

// Falls noch kein Timer existiert:
if (!startTime) {
    startTime = Date.now();
    localStorage.setItem("healthTimerStart", startTime);
}

const timerDisplay = document.getElementById("timer");
const resetButton = document.getElementById("resetTimer");

// Timer aktualisieren
function updateTimer() {

    const elapsed = Date.now() - Number(startTime);
    let remaining = TIMER_DURATION - elapsed;

    if (remaining <= 0) {
        timerDisplay.textContent = "00:00:00";
        return;
    }

    const hours = Math.floor(remaining / 3600000);
    const minutes = Math.floor((remaining % 3600000) / 60000);
    const seconds = Math.floor((remaining % 60000) / 1000);

    timerDisplay.textContent =
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
}

// Reset-Funktion
resetButton.addEventListener("click", function() {

    startTime = Date.now();

    localStorage.setItem("healthTimerStart", startTime);

    updateTimer();

});

// Jede Sekunde aktualisieren
updateTimer();
setInterval(updateTimer, 1000);

</script>
