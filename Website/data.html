<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="design.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data</title>

</head>

<body>
  <div class="wrapper">

    <header class="header">
      <h1>Health Monitoring Software</h1>
    </header>

    <div class="content">
      <nav class="nav">
        <aside>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="data.html">Messen</a></li>
            <li><a href="auswertung.py">Auswertung</a></li>
            <li><a href="symthome.html">Symptome</a></li>
            <li><a href="verlaufgraph.js">Verlauf</a></li>
            <li><a href="training.md">Training</a></li>
          </ul>
        </aside>
      </nav>

      <main class="main">
        <article>
          <header>
            <h3>Physical Health</h3>
          </header>

          <label>
            Heart rate (bpm)
            <input type="number" id="herzfrequenz" required>
          </label>

          <label>
            Blood pressure (mmHg)
            <input type="text" id="blutdruck" placeholder="120/80" required>
          </label>

          <label>
            Body temperature (°C)
            <input type="number" step="0.1" id="koerpertemperatur" required>
          </label>

          <label>
            Oxygen saturation (%)
            <input type="number" id="sauerstoffsaettigung" required>
          </label>

          <label>
            Sleep duration (hours)
            <input type="number" step="0.1" id="schlafdauer" required>
          </label>

          <label>
            Bone density (g/cm²)
            <input type="number" step="0.01" id="knochendichte" required>
          </label>

          <label>
            Initial bone density (g/cm²)
            <input type="number" step="0.01" id="anfangs_knochendichte" required>
          </label>

          <label>
            Muscle strength (N)
            <input type="number" id="muskelkraft" required>
          </label>

          <label>
            Initial muscle strength (N)
            <input type="number" id="ausgangswert_muskelkraft" required>
          </label>

          <label>
            Sport duration (hours)
            <input type="number" step="0.1" id="sport" required>
          </label>
        </article>
          
          </article>
        <h3>Radiation Exposure</h3>
        </header>

        <label>
          Radiation exposure (mSv)
          <input type="number" step="0.01" id="strahlungsbelastung" required>
        </label>

        <label>
          Measurement location
          <select id="bereich" required>
            <option value="1">Inside</option>
            <option value="2">Outside</option>
          </select>
        </label>
        </article>


        <article>
          <header>
            <h3>Mental states</h3>
          </header>

   
        </article>
        <form id="healthForm">
          <button type="submit">Evaluate measurements</button>
        </form>

        <article id="resultBox" hidden>
          <header>
            <h3>Evaluation Results</h3>
          </header>

          <div id="results"></div>
        </article>



      </main>

    </div>

    <footer class="footer">
      <p>© 2026 Health Monitoring Software</p>
    </footer>

  </div>

  <script>

    document.getElementById("healthForm").addEventListener("submit", async function (event) {

      event.preventDefault();

      const daten = {
        herzfrequenz: Number(document.getElementById("herzfrequenz").value),
        blutdruck: document.getElementById("blutdruck").value,
        koerpertemperatur: Number(document.getElementById("koerpertemperatur").value),
        sauerstoffsaettigung: Number(document.getElementById("sauerstoffsaettigung").value),
        schlafdauer: Number(document.getElementById("schlafdauer").value),
        knochendichte: Number(document.getElementById("knochendichte").value),
        anfangs_knochendichte: Number(document.getElementById("anfangs_knochendichte").value),
        ernaehrung: Number(document.getElementById("ernaehrung").value),
        strahlungsbelastung: Number(document.getElementById("strahlungsbelastung").value),
        bereich: Number(document.getElementById("bereich").value),
        muskelkraft: Number(document.getElementById("muskelkraft").value),
        ausgangswert_muskelkraft: Number(document.getElementById("ausgangswert_muskelkraft").value),
        sport: Number(document.getElementById("sport").value)
      };

      try {

        const antwort = await fetch("/api/auswertung", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(daten)
        });

        const ergebnis = await antwort.json();

        if (!antwort.ok) {
          throw new Error(ergebnis.fehler || "Evaluation failed");
        }

        const ausgabe = document.getElementById("results");
        ausgabe.innerHTML = "";

        for (const [wert, kritisch] of Object.entries(ergebnis.bewertung)) {

          const zeile = document.createElement("p");

          if (kritisch === true) {
            zeile.textContent = wert + ": Critical value";
          } else if (kritisch === false) {
            zeile.textContent = wert + ": No critical value detected";
          } else {
            zeile.textContent = wert + ": No evaluation possible";
          }

          ausgabe.appendChild(zeile);
        }

        document.getElementById("resultBox").hidden = false;

      } catch (fehler) {

        alert("Error: " + fehler.message);

      }

    });

  </script>

</body>

</html>
