<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="../css/design.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">



  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data</title>

</head>

<body>
  <div class="wrapper">

    <header class="header">
      <h1>Health Monitoring Software</h1>
    </header>

    <div class="content">
      <nav class="nav">
        <aside>
          <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="vitalMeasurements.html">Messen</a></li>
            <li><a href="../php/auswertung.php">Auswertung</a></li>
            <li><a href="symthome.html">Symptome</a></li>
            <li><a href="verlauf.html">Verlauf</a></li>
            <li><a href="training.html">Training</a></li>
          </ul>
        </aside>
      </nav>

      <main class="main">
        <form action="../php/pushedHealthData.php" method="post">
            <label for="Astronaut-Name"><h3>Astronaut Name</h3></label>
            <select name="Astronaut-Name" id="Astronaut-Name" required>
                <option value="Glover">Glover</option>
                <option value="Hansen">Hansen</option>
                <option value="Koch">Koch</option>
                <option value="Wiseman">Wiseman</option>
            </select>

            <label><h3>Physical Health</h3></label>


            <label for="BPM">Heart rate (bpm)</label>
            <input name="BPM" type="number" id="bpm" max="300" min="0" required>
            
            <table>
              <tr>
                <label>Blood pressure (mmHg)</label>
                <td>
                  <label for="Systole">Systole</label>
                  <input name="Systole" type="number" id="systole" placeholder="120" max="300" min="0" required>
                </td>
                <td>
                  <label for="Diastole">Diastole</label>
                  <input name="Diastole" type="number" id="diastole" placeholder="80" max="200" min="0" required>
                </td>
              </tr>
            </table>
           
            
            
            

            <label for="Bodytemperature">Body temperature (°C)</label>
            <input name="Bodytemperature" type="number" step="0.1" id="koerpertemperatur" min="0" max="50" required>

            <label for="Oxygen-Saturation">Oxygen saturation (%)</label>
            <input name="Oxygen-Saturation" type="number" id="sauerstoffsaettigung" max="100" min="0" required>

            <label for="Weight">Weight (kg)</label>
            <input name="Weight" type="number" id="weight" max="200" min="0" required>

            <label for="Sleep-Duration">Sleep duration (hours)</label>
            <input name="Sleep-Duration" type="number" step="0.1" id="schlafdauer" min="0" max="24" required>

            <label for="Bone-Density">Bone density (g/cm²)</label>
            <input name="Bone-Density" type="number" step="0.01" id="knochendichte" >

            <label for="Muscle-Strength">Muscle strength (N)</label>
            <input name="Muscle-Strength" type="number" id="muskelkraft">

            <label for="Sport-Duratuion">Sport duration (hours)</label>
            <input name="Sport-Duration" type="number" step="0.1" id="sport" required>
            

            
            <label><h3>Radiation Exposure</h3></label>
       
            
            <label for="Radiation-Exposure">Radiation exposure (mSv)</label>
            <input name="Radiation-Exposure" type="number" step="0.01" id="Radiation-Exposure">
    
            <label for="Measurement-Location">Measurement location</label>                
            <select name="Measurement-Location" id="Measurement-Location">
              <option value="Not-Measured">Not Measured</option>
                <option value="Inside">Inside</option>
                <option value="Outside">Outside</option>
            </select>

            <button id="healthValues" type="submit"><h3>Submit</h3></button>
        </form>
      </main> 
    </div>

    <footer class="footer">
      <p>© 2026 Health Monitoring Software</p>
    </footer>
  </div>
  


  <script>

    document.getElementById("healthForm").addEventListener("submit", async function (event) {

      event.preventDefault();

      const daten = {
        herzfrequenz: Number(document.getElementById("herzfrequenz").value),
        blutdruck: document.getElementById("blutdruck").value,
        koerpertemperatur: Number(document.getElementById("koerpertemperatur").value),
        sauerstoffsaettigung: Number(document.getElementById("sauerstoffsaettigung").value),
        schlafdauer: Number(document.getElementById("schlafdauer").value),
        knochendichte: Number(document.getElementById("knochendichte").value),
        anfangs_knochendichte: Number(document.getElementById("anfangs_knochendichte").value),
        ernaehrung: Number(document.getElementById("ernaehrung").value),
        strahlungsbelastung: Number(document.getElementById("strahlungsbelastung").value),
        bereich: Number(document.getElementById("bereich").value),
        muskelkraft: Number(document.getElementById("muskelkraft").value),
        ausgangswert_muskelkraft: Number(document.getElementById("ausgangswert_muskelkraft").value),
        sport: Number(document.getElementById("sport").value)
      };

      try {

        const antwort = await fetch("/api/auswertung", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(daten)
        });

        const ergebnis = await antwort.json();

        if (!antwort.ok) {
          throw new Error(ergebnis.fehler || "Evaluation failed");
        }

        const ausgabe = document.getElementById("results");
        ausgabe.innerHTML = "";

        for (const [wert, kritisch] of Object.entries(ergebnis.bewertung)) {

          const zeile = document.createElement("p");

          if (kritisch === true) {
            zeile.textContent = wert + ": Critical value";
          } else if (kritisch === false) {
            zeile.textContent = wert + ": No critical value detected";
          } else {
            zeile.textContent = wert + ": No evaluation possible";
          }

          ausgabe.appendChild(zeile);
        }

        document.getElementById("resultBox").hidden = false;

      } catch (fehler) {

        alert("Error: " + fehler.message);

      }

    });

  </script>

</body>

</html>
