  <script>

    document.getElementById("healthForm").addEventListener("submit", async function (event) {

      event.preventDefault();

      const daten = {
        herzfrequenz: Number(document.getElementById("herzfrequenz").value),
        blutdruck: document.getElementById("blutdruck").value,
        koerpertemperatur: Number(document.getElementById("koerpertemperatur").value),
        sauerstoffsaettigung: Number(document.getElementById("sauerstoffsaettigung").value),
        schlafdauer: Number(document.getElementById("schlafdauer").value),
        knochendichte: Number(document.getElementById("knochendichte").value),
        anfangs_knochendichte: Number(document.getElementById("anfangs_knochendichte").value),
        ernaehrung: Number(document.getElementById("ernaehrung").value),
        strahlungsbelastung: Number(document.getElementById("strahlungsbelastung").value),
        bereich: Number(document.getElementById("bereich").value),
        muskelkraft: Number(document.getElementById("muskelkraft").value),
        ausgangswert_muskelkraft: Number(document.getElementById("ausgangswert_muskelkraft").value),
        sport: Number(document.getElementById("sport").value)
      };

      try {

        const antwort = await fetch("/api/auswertung", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(daten)
        });

        const ergebnis = await antwort.json();

        if (!antwort.ok) {
          throw new Error(ergebnis.fehler || "Evaluation failed");
        }

        const ausgabe = document.getElementById("results");
        ausgabe.innerHTML = "";

        for (const [wert, kritisch] of Object.entries(ergebnis.bewertung)) {

          const zeile = document.createElement("p");

          if (kritisch === true) {
            zeile.textContent = wert + ": Critical value";
          } else if (kritisch === false) {
            zeile.textContent = wert + ": No critical value detected";
          } else {
            zeile.textContent = wert + ": No evaluation possible";
          }

          ausgabe.appendChild(zeile);
        }

        document.getElementById("resultBox").hidden = false;

      } catch (fehler) {

        alert("Error: " + fehler.message);

      }

    });

  </script>
