<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="design.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data</title>

</head>

<body>
  <div class="wrapper">

    <header class="header">
      <h1>Health Monitoring Software</h1>
    </header>

    <div class="content">
      <nav class="nav">
        <aside>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="vitalMeasurements.html">Messen</a></li>
            <li><a href="auswertung.html">Auswertung</a></li>
            <li><a href="symthome.html">Symptome</a></li>
            <li><a href="verlauf.html">Verlauf</a></li>
            <li><a href="training.html">Training</a></li>
          </ul>
        </aside>
      </nav>

      <main class="main">
        <form action="pushedHealthData.php" method="post">
            <label for="astonautName">Astronaut</label>
            <select name="astronautName" id="astronautName">
                <option>Neil Armstrong</option>
                <option>Donald Trump</option>
                <option>Vladimir Putin</option>
            </select>

            <label for=""><h3>Physical Health</h3></label>


            <label for="herzfrequenz">Heart rate (bpm)</label>
            <input name="herzfrequenz" type="number" id="herzfrequenz" >

            <label for="blutdruck">Blood pressure (mmHg)</label>
            <input name="blutdruck" type="text" id="blutdruck" placeholder="120/80" required>
            

            <label for="koerpertemperatur">Body temperature (°C)</label>
            <input name="koerpertemperatur" type="number" step="0.1" id="koerpertemperatur" required>

            <label for="sauerstoffsaettigung">Oxygen saturation (%)</label>
            <input name="sauerstoffsaettigung" type="number" id="sauerstoffsaettigung" required>

            <label for="schlafdauer">Sleep duration (hours)</label>
            <input name="schlafdauer" type="number" step="0.1" id="schlafdauer" required>

            <label for="knochendichte">Bone density (g/cm²)</label>
            <input name="knochendichte" type="number" step="0.01" id="knochendichte" required>

            <label for="anfangs_knochendichte">Initial bone density (g/cm²)</label>
            <input name="anfangs_knochendichte" type="number" step="0.01" id="anfangs_knochendichte" required>

            <label for="muskelkraft">Muscle strength (N)</label>
            <input name="muskelkraft" type="number" id="muskelkraft" required>

            <label for="ausgangswert_muskelkraft">Initial muscle strength (N)</label>
            <input name="ausgangswert_muskelkraft" type="number" id="ausgangswert_muskelkraft" required>

            <label for="name">Sport duration (hours)</label>
            <input name="sport" type="number" step="0.1" id="sport" required>
            

            
            <label><h3>Radiation Exposure</h3></label>
       
            
            <label for="strahlungsbelastung">Radiation exposure (mSv)</label>
            <input name="strahlungsbelastung" type="number" step="0.01" id="strahlungsbelastung" required>
    
            <label for="bereich">Measurement location</label>                
            <select name="bereich" id="bereich" required>
                <option value="1">Inside</option>
                <option value="2">Outside</option>
            </select>

            <button type="submit"><h3>Submit</h3></button>
        </form>
        



      </main>

    </div>

    <footer class="footer">
      <p>© 2026 Health Monitoring Software</p>
    </footer>

  </div>

  <script>

    document.getElementById("healthForm").addEventListener("submit", async function (event) {

      event.preventDefault();

      const daten = {
        herzfrequenz: Number(document.getElementById("herzfrequenz").value),
        blutdruck: document.getElementById("blutdruck").value,
        koerpertemperatur: Number(document.getElementById("koerpertemperatur").value),
        sauerstoffsaettigung: Number(document.getElementById("sauerstoffsaettigung").value),
        schlafdauer: Number(document.getElementById("schlafdauer").value),
        knochendichte: Number(document.getElementById("knochendichte").value),
        anfangs_knochendichte: Number(document.getElementById("anfangs_knochendichte").value),
        ernaehrung: Number(document.getElementById("ernaehrung").value),
        strahlungsbelastung: Number(document.getElementById("strahlungsbelastung").value),
        bereich: Number(document.getElementById("bereich").value),
        muskelkraft: Number(document.getElementById("muskelkraft").value),
        ausgangswert_muskelkraft: Number(document.getElementById("ausgangswert_muskelkraft").value),
        sport: Number(document.getElementById("sport").value)
      };

      try {

        const antwort = await fetch("/api/auswertung", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(daten)
        });

        const ergebnis = await antwort.json();

        if (!antwort.ok) {
          throw new Error(ergebnis.fehler || "Evaluation failed");
        }

        const ausgabe = document.getElementById("results");
        ausgabe.innerHTML = "";

        for (const [wert, kritisch] of Object.entries(ergebnis.bewertung)) {

          const zeile = document.createElement("p");

          if (kritisch === true) {
            zeile.textContent = wert + ": Critical value";
          } else if (kritisch === false) {
            zeile.textContent = wert + ": No critical value detected";
          } else {
            zeile.textContent = wert + ": No evaluation possible";
          }

          ausgabe.appendChild(zeile);
        }

        document.getElementById("resultBox").hidden = false;

      } catch (fehler) {

        alert("Error: " + fehler.message);

      }

    });

  </script>

</body>

</html>
